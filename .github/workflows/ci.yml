name: ci

on:
  push:
    branches: [main, 'ci-check/**']
  pull_request:
  workflow_dispatch:
    inputs:
      corpora:
        description: Fetch the third-party test corpora first (without them those tests skip)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-test:
    name: build and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: win-x64, os: windows-latest }
          - { name: linux-x64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: osx-arm64, os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore OneAudio.slnx
      - name: Build (warnings are errors)
        run: dotnet build OneAudio.slnx -c Release --no-restore
      - name: Fetch test corpora
        if: ${{ inputs.corpora && runner.os != 'Windows' }}
        shell: bash
        run: |
          tools/fetch-corpus.sh "$RUNNER_TEMP/corpus"
          echo "ONEAUDIO_CORPUS=$RUNNER_TEMP/corpus" >> "$GITHUB_ENV"
      - name: Test (tests that need corpora or reference tools skip when those are absent)
        run: dotnet test --project tests/OneAudio.Tests/OneAudio.Tests.csproj -c Release --no-build
      - name: Test the device layer (manual and fake backends; real-device tests skip unless asked for)
        run: dotnet test --project tests/OneAudio.Devices.Tests/OneAudio.Devices.Tests.csproj -c Release --no-build
      - name: Repository rules (no package references, unsafe code only where allowed)
        if: ${{ matrix.name == 'linux-x64' }}
        run: tools/check-repo.sh

  aot-smoke:
    name: NativeAOT publish (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest }
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: osx-arm64, os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish with trim and AOT warnings as errors
        run: >
          dotnet publish tests/OneAudio.AotSmoke/OneAudio.AotSmoke.csproj
          -c Release -r ${{ matrix.rid }} -o smoke-out
          -p:TreatWarningsAsErrors=true -p:TrimmerSingleWarn=false
      - name: Run the published binary
        shell: bash
        run: ./smoke-out/OneAudio.AotSmoke

  pack:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Pack (warnings are errors)
        run: |
          dotnet pack src/OneAudio/OneAudio.csproj -c Release -o nupkg
          dotnet pack src/OneAudio.Devices/OneAudio.Devices.csproj -c Release -o nupkg
      - name: List package contents
        run: for p in nupkg/*.nupkg; do unzip -l "$p"; done
